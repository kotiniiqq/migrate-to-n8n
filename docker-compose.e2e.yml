# Throwaway n8n instances for `npm run e2e`: the current 2.x and the last 1.x. No volumes; nothing is kept.
services:
  n8n2:
    image: n8nio/n8n:2.44.4
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: "UTC"
  n8n1:
    image: n8nio/n8n:1.123.85
    ports: ["127.0.0.1:5679:5678"]
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: "UTC"
